<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Поздравляем!</title>
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:#111;color:white;font-family:Arial,sans-serif}
  .box{text-align:center}
  h1{font-size:clamp(40px,9vw,90px);margin:0 0 20px}
  p{font-size:22px;color:#aaa}
  button{font-size:20px;padding:14px 24px;border:0;border-radius:12px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <h1>🎉 ПОЗДРАВЛЯЕМ!</h1>
  <p>Ты попался на пранк 😈</p>
  <button id="start">Запустить звук</button>
</div>

<script>
const start = document.getElementById('start');

function scareSound() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const gain = ctx.createGain();
  gain.gain.value = 0.9;
  gain.connect(ctx.destination);

  // Резкий короткий "скример" без внешних файлов.
  const osc = ctx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(180, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(1400, ctx.currentTime + 0.08);
  osc.frequency.exponentialRampToValueAtTime(90, ctx.currentTime + 0.9);
  osc.connect(gain);

  const noise = ctx.createBufferSource();
  const buffer = ctx.createBuffer(1, ctx.sampleRate * 0.9, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < data.length; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.45));
  }
  noise.buffer = buffer;
  noise.connect(gain);

  osc.start();
  noise.start();

  setTimeout(() => {
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.25);
  }, 650);
}

start.addEventListener('click', () => {
  scareSound();
  start.textContent = '😈 Пранк активирован!';
});
</script>
</body>
</html>
